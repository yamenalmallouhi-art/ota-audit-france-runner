name: OTA Audit browser runner

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: ota-audit-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le PHP Hostinger
        run: |
          find deploy tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -d zend.assertions=1 -d assert.exception=1 tests/run.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - working-directory: runner
        run: npm install --ignore-scripts

      - working-directory: runner
        run: npm test

      - working-directory: runner
        run: npx playwright install --with-deps chromium

      - name: Trouver de nouveaux hôtels
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: runner
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
          PROSPECT_TARGETS_PER_RUN: '1'
          PROSPECT_MAX_PER_RUN: '100'
        run: node src/prospect-finder.js

      - name: Exécuter les audits
        working-directory: runner
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
        run: npm run audit

      - name: Finaliser les audits et envoyer les emails
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OTA_RUNNER_TOKEN" \
            "$OTA_BASE_URL/automation/worker-trigger.php"
