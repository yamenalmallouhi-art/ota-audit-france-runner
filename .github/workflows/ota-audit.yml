name: OTA Audit browser runner

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 6 * * *'

  workflow_dispatch:

concurrency:
  group: ota-audit-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le PHP Hostinger
        run: |
          find deploy tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -d zend.assertions=1 -d assert.exception=1 tests/run.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Node
        working-directory: runner
        run: npm install --ignore-scripts

      - name: Tester le runner
        working-directory: runner
        run: npm test

      - name: Installer Chromium
        working-directory: runner
        run: npx playwright install --with-deps chromium

      - name: Tester le prospecteur international
        if: github.event_name == 'workflow_dispatch'
        working-directory: runner
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
          PROSPECT_AREAS_PER_COUNTRY: '1'
        run: node src/prospect-finder.js
        
      # ---------------------------------------------------------
      # PROSPECTION QUOTIDIENNE
      # ---------------------------------------------------------

      - name: Trouver de nouveaux hôtels
        if: github.event.schedule == '17 6 * * *'
        working-directory: runner
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
          PROSPECT_AREAS_PER_COUNTRY: '1'
        run: node src/prospect-finder.js

      - name: Auditer 10 prospects commerciaux
        if: github.event.schedule == '17 6 * * *'
        working-directory: runner
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
          PROSPECT_AUDIT_LIMIT: '10'
        run: node src/prospect-auditor.js

      - name: Générer jusqu'à 10 messages commerciaux
        if: github.event.schedule == '17 6 * * *'
        working-directory: runner
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
          PROSPECT_MESSAGE_LIMIT: '10'
        run: node src/prospect-message-generator.js

      - name: Envoyer maximum 10 emails commerciaux
        if: github.event.schedule == '17 6 * * *'
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OTA_RUNNER_TOKEN" \
            "$OTA_BASE_URL/automation/send-prospect-emails.php"

      # ---------------------------------------------------------
      # AUDITS CLIENTS
      # ---------------------------------------------------------

      - name: Exécuter les audits clients
        working-directory: runner
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
        run: npm run audit

      - name: Finaliser les audits et envoyer les emails clients
        env:
          OTA_BASE_URL: ${{ secrets.OTA_BASE_URL }}
          OTA_RUNNER_TOKEN: ${{ secrets.OTA_RUNNER_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OTA_RUNNER_TOKEN" \
            "$OTA_BASE_URL/automation/worker-trigger.php"
